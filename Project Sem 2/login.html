<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amazon Sign In</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <a href="index.html">amazon.in</a>
        </div>
        
        <div class="login-box">
            <h1>Sign in</h1>
            <form>
                <label for="email">Email or mobile phone number</label>
                <input type="text" id="email" name="email">
                <button type="button" class="continue-btn" onclick="location.href='index.html'">Continue</button>
            </form>
            <p class="terms">By continuing, you agree to Amazon's <a href="#">Conditions of Use</a> and <a href="#">Privacy Notice</a>.</p>
            <div class="help">
                <a href="#">Need help?</a>
            </div>
        </div>

        <div class="new-account">
            <div class="divider">
                <h5>New to Amazon?</h5>
            </div>
            <button class="create-btn">Create your Amazon account</button>
        </div>
    </div>

    <footer class="login-footer">
        <div class="footer-links">
            <a href="#">Conditions of Use</a>
            <a href="#">Privacy Notice</a>
            <a href="#">Help</a>
        </div>
        <p>&copy; 1996-2023, Amazon.com, Inc. or its affiliates</p>
    </footer>
</body>
</html>
